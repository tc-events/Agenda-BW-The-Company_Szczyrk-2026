<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Weekend Szczyrk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,300;1,400&display=swap">
<style>
/* Layout: navy brand band (logo + countdown) → sticky section tabs → single 820px column; red square as the only accent motif */
:root{
  --navy:#121635; --red:#DC143C; --white:#fff;
  --bg:#f6f6f9; --surface:#ffffff; --surface-2:#eef0f6; --fg:#121635; --muted:#5b607a; --line:#d9dce8;
  --shared:#fcecef; --shared-line:#f3c3cd; --chip:#e7e9f2;
  --band:#121635; --band-fg:#ffffff; --band-muted:#a9adc6;
  --f:"Roboto",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d20; --surface:#14183a; --surface-2:#1b2048; --fg:#eef0f8; --muted:#a3a8c6; --line:#2a3060;
  --shared:#2a1530; --shared-line:#5a2238; --chip:#232a58; --band:#0e1130; --band-fg:#fff; --band-muted:#9da2c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d20; --surface:#14183a; --surface-2:#1b2048; --fg:#eef0f8; --muted:#a3a8c6; --line:#2a3060;
  --shared:#2a1530; --shared-line:#5a2238; --chip:#232a58; --band:#0e1130; --band-fg:#fff; --band-muted:#9da2c2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sq{display:inline-block;width:.42em;height:.42em;background:var(--red);vertical-align:baseline}

/* hero: navy title block → full-bleed photo with red address box → navy partner bar */
.hero{background:var(--band);color:var(--band-fg)}
.hero-top{position:relative;padding-block:28px 30px}
.ttl{position:relative;padding:26px 120px 0 30px;max-width:780px}
.bracket{position:absolute;left:0;top:0;width:min(46%,230px);height:min(150px,78%);border-left:3px solid var(--red);border-top:3px solid var(--red);pointer-events:none}
h1{font-weight:700;font-size:clamp(34px,7.4vw,62px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance;position:relative}
.date{font-weight:500;font-size:clamp(20px,3.8vw,32px);margin-top:18px}
.tagline{font-weight:300;font-size:15px;color:var(--band-muted);margin-top:4px}
.hero-top .wrap{position:relative}
.sqs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:0;width:90px;height:80px;pointer-events:none}
.sqs i{position:absolute;background:var(--red)}
.sqs i:first-child{left:0;top:34px;width:44px;height:44px}.sqs i:last-child{right:0;top:0;width:22px;height:22px}
.count{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;padding-left:30px}
.count div{border:1px solid rgba(255,255,255,.18);padding:8px 12px;min-width:68px}
.count b{display:block;font-weight:300;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--band-muted)}
.hphoto{position:relative;background:#1e3a20}
.hphoto img{display:block;width:100%;max-width:100%;height:clamp(200px,34vw,380px);object-fit:cover;object-position:55% 50%}
.addr{position:absolute;right:0;bottom:clamp(14px,3vw,28px);background:var(--red);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 22px;text-align:right;max-width:calc(100% - 16px)}
.addr b{display:block;font-weight:700;font-size:clamp(15px,2.4vw,22px);line-height:1.2}
.addr span{font-size:clamp(13px,2vw,19px);font-weight:400}
.hbar .wrap{padding-block:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hbar img{height:clamp(30px,5vw,44px);width:auto;max-width:100%}
.logo{display:inline-flex;align-items:baseline;font-family:"Roboto",Arial,sans-serif;font-size:clamp(26px,4vw,36px);line-height:1;letter-spacing:-.005em;white-space:nowrap;color:var(--band-fg)}
.logo .t{font-weight:100}.logo .c{font-weight:400;margin-left:.2em}
.logo i{display:inline-block;width:.26em;height:.26em;background:var(--red);margin-left:.07em}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);border-top:1px solid rgba(255,255,255,.08)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--band-muted);padding:13px 12px 11px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--band-fg);border-bottom-color:var(--red)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--red);color:#fff;font-size:11px;letter-spacing:0;border-radius:9px;line-height:18px;text-align:center}

main .wrap{padding-block:24px 64px}
h2{font-weight:300;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
h2+.lead{color:var(--muted);margin:0 0 20px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* controls */
.seg{display:inline-flex;background:var(--surface-2);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--red)}}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.day{border:1px solid var(--line);background:var(--surface);padding:10px 12px;text-align:left;display:flex;align-items:baseline;gap:10px}
.day b{font-size:30px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.day span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--red)}
:root[data-theme="dark"] .day[aria-pressed="true"]{border-color:var(--fg)}
.daynote{font-size:13px;color:var(--muted);margin:10px 0 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;display:inline-block}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:84px;top:6px;bottom:6px;width:1px;background:var(--line)}
.row{display:grid;grid-template-columns:72px 1fr;gap:24px;position:relative;padding:5px 0}
.time{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;padding-top:2px;line-height:1.3}
.time small{display:block;font-weight:400;opacity:.8}
.row::after{content:"";position:absolute;left:81px;top:10px;width:7px;height:7px;border:1px solid var(--muted);background:var(--bg);border-radius:50%}
.row.prog::after{background:var(--navy);border-color:var(--navy);width:9px;height:9px;left:80px;top:9px}
.row.sh::after{background:var(--red);border-color:var(--red)}
.row.sh .time{color:var(--red)}
.lite{font-size:14px;color:var(--fg);font-weight:500;padding-top:1px}
.lite.dim{color:var(--muted);font-weight:400;font-style:italic}
.card{background:var(--surface);border:1px solid var(--line);position:relative;padding:12px 40px 12px 14px;min-width:0;text-align:left;width:100%}
.row.sh .card{background:var(--shared);border-color:var(--shared-line)}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:2px solid var(--red);border-top:2px solid var(--red)}
.card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg)}
.tag{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--navy);color:#fff;padding:2px 7px;font-weight:500}
.tag.r{background:var(--red)}
.card h3{font-size:17px;font-weight:500;margin:6px 0 2px;line-height:1.3;text-wrap:balance}
.card .sub{font-style:italic;color:var(--muted);font-size:13.5px;margin:0}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.who button,.pl{background:none;border:0;padding:0;text-align:left}
.who b,.pl b{display:block;font-size:13.5px;font-weight:500}
.who span,.pl span{font-size:12px;color:var(--muted)}
.who button:hover b{color:var(--red)}
.mod{margin-top:8px;font-size:12px}
.mod em{font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:500;font-size:10px;margin-right:6px}
.star{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.star svg{width:17px;height:17px}
.star[aria-pressed="true"]{color:var(--red)}
.star[aria-pressed="true"] path{fill:currentColor}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice button{background:var(--surface-2);border:1px solid var(--line);border-top:2px solid var(--red);padding:10px;text-align:left}
.choice b{display:block;font-size:14px;font-weight:500}
.choice span{font-size:12px;color:var(--muted)}
.choice button:hover{border-color:var(--red)}
.rooms{display:grid;gap:6px;margin-top:10px}
.room{display:grid;grid-template-columns:28px 1fr;gap:6px;background:var(--surface-2);padding:8px 10px}
.room>i{font-style:normal;color:var(--red);font-weight:700;font-size:14px}
.room b{font-size:13.5px;font-weight:500;display:block}
.room span{font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--red);font-size:13px;font-weight:500;margin-top:8px}
.empty{padding:28px 18px;border:1px dashed var(--line);text-align:center;color:var(--muted)}

/* speakers */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-size:12px;letter-spacing:.06em}
.chips button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sp{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;gap:12px;min-width:0;text-align:left}
.ini{flex:none;width:44px;height:44px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:300;font-size:16px;position:relative}
.ini::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;background:var(--red)}
.sp h4{margin:0;font-size:15px;font-weight:500}
.sp .co{font-size:12.5px;color:var(--muted)}
.sp ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.sp li{font-size:12px;line-height:1.35}
.sp li i{font-style:normal;color:var(--red);font-variant-numeric:tabular-nums;margin-right:4px}
.partners{margin-top:22px;font-size:13px;color:var(--muted)}
.partners b{color:var(--fg);font-weight:500}

/* activities */
.acts{display:grid;gap:12px}
.act{background:var(--surface);border:1px solid var(--line);min-width:0;overflow:hidden}
.art{position:relative;height:190px;background:#121635;color:#fff}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.art .ov{position:absolute;left:0;right:0;top:0;padding:16px 18px;display:grid;gap:8px;justify-items:start}
.pill{background:var(--red);color:#fff;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:4px 9px;font-weight:500}
.art h3{margin:0;font-size:clamp(26px,5vw,34px);line-height:1.02;font-weight:300;letter-spacing:-.01em}
.art h3 b{font-weight:700;display:block}
.art .tl2{font-size:13px;color:#c9cce0;font-weight:300}
.act .body{padding:14px 18px 18px;min-width:0}
.act p{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}
.act .body .link{display:inline-block}
.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:14px}
.feats{display:grid;gap:0;border-top:1px solid var(--line)}
.feat{display:grid;grid-template-columns:28px minmax(150px,210px) minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.feat b{font-size:14px;font-weight:500}
.feat span{font-size:13.5px;color:var(--muted);line-height:1.5}
.feat i{font-style:normal;color:var(--red);font-size:11px;letter-spacing:.14em;font-weight:500}
@media (max-width:560px){.feat{grid-template-columns:28px minmax(0,1fr)}.feat span{grid-column:2}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface-2);padding:8px 10px}
.stats b{display:block;font-size:20px;font-weight:300}
.stats span{font-size:11px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps li{display:grid;grid-template-columns:52px 1fr;font-size:13.5px}
.steps li i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--red);font-weight:500}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--red);padding-left:10px}
.h5{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}

/* about */
.about{display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);padding:18px}
.navybox{background:var(--band);color:var(--band-fg);padding:22px;position:relative}
.navybox::before{content:"";display:block;width:26px;height:4px;background:var(--red);margin-bottom:14px}
.navybox h3{font-weight:500;font-size:24px;margin:0 0 8px;line-height:1.2}
.navybox p{color:var(--band-muted);margin:0;max-width:60ch}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kv div span{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kv div b{font-weight:400;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .box h3{margin:0 0 6px;font-weight:400;font-size:20px}
.two .box p{margin:0 0 10px;color:var(--muted);font-size:14px}
.two ul{margin:0;padding-left:18px;font-size:14px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hl div{background:var(--surface);border:1px solid var(--line);padding:14px}
.hl b{display:block;font-size:34px;font-weight:100;line-height:1;font-variant-numeric:tabular-nums}
.hl span{font-size:12.5px;color:var(--muted)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:18px 28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;font-size:13px;z-index:20;border-left:3px solid var(--red)}

@media (max-width:560px){
  .sqs{top:auto;bottom:0;width:54px;height:48px}.sqs i:first-child{top:20px;width:26px;height:26px}.sqs i:last-child{width:13px;height:13px}.ttl{padding:22px 0 0 20px}.count{padding-left:20px;padding-right:66px}
  .tl::before{left:58px}.row{grid-template-columns:48px 1fr;gap:20px}.row::after{left:55px}.row.prog::after{left:54px}
  .time{font-size:11px}.who{grid-template-columns:1fr}.choice{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}
  .day b{font-size:24px}.day{flex-direction:column;gap:2px}
}
@media (prefers-reduced-motion:no-preference){.card,.sp,.act{transition:border-color .15s}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<header class="hero">
  <div class="hero-top"><div class="wrap">
    <div class="sqs" aria-hidden="true"><i></i><i></i></div>
    <div class="ttl"><span class="bracket" aria-hidden="true"></span><h1>Business Weekend<br>The Company</h1>
      <div class="date">6–8 listopada 2026</div>
      <div class="tagline">Zaplanuj rozwój swojego biznesu · pierwsza wspólna edycja CC × BNI+</div></div>

function personBtns(arr){return arr.map(p=>`<button data-person="${esc(p.n)}"><b>${esc(p.n)}</b>${p.c?`<span>${esc(p.c)}</span>`:''}</button>`).join('')}

function cardHTML(x){
  const tagCls=/Panel|Debata|Breakout|Opcjonalnie/.test(x.type)?'tag r':'tag';
  let h=`<div class="card"><span class="${tagCls}">${esc(x.type)}</span><h3>${esc(x.title)}</h3>${x.sub?`<p class="sub">${esc(x.sub)}</p>`:''}`;
  if(x.people&&x.people.length) h+=`<div class="who">${personBtns(x.people)}</div>`;
  if(x.mod) h+=`<div class="mod"><em>Moderacja</em><b>${esc(x.mod.n)}</b>${x.mod.c?` <span style="color:var(--muted)">${esc(x.mod.c)}</span>`:''}</div>`;
  if(x.rooms) h+=`<div class="rooms">${x.rooms.map(r=>`<div class="room"><i>${r.r}</i><div><b>${esc(r.title)}</b><span>${[...r.people.map(p=>`${p.n} (${p.c})`),...r.orgs].map(esc).join(' · ')}</span></div></div>`).join('')}</div>`;
  if(x.choice) h+=`<div class="choice">${x.choice.map(k=>`<button data-act="${k}"><b>${esc(ACTS[k].title)}</b><span>${esc(ACTS[k].time)} · szczegóły</span></button>`).join('')}</div>`;
  if(x.act) h+=`<button class="link" data-act="${x.act}">Szczegóły aktywności →</button>`;
  h+=`<button class="star" data-fav="${x.id}" aria-pressed="${fav.has(x.id)}" aria-label="${fav.has(x.id)?'Usuń z':'Dodaj do'} mojej agendy">${starSvg}</button></div>`;
  return h;
}
function rowHTML(x,showShared=true){
  const sh=showShared&&shared(x)&&x.k==='prog';
  const t=`<div class="time">${x.s}<small>${x.e}</small></div>`;
  if(x.k==='log') return `<li class="row">${t}<div class="lite${x.dim?' dim':''}">${esc(x.title)}</div></li>`;
  return `<li class="row prog${sh?' sh':''}">${t}${cardHTML(x)}</li>`;
}

function vMoja(){
  const picked=S.filter(x=>fav.has(x.id));
  if(!picked.length) return `<h2>Moja agenda</h2><p class="lead">Twój osobisty plan weekendu.</p>
   <div class="empty">Nic tu jeszcze nie ma. Otwórz <button class="link" data-go="agenda" style="margin:0">Agendę</button> i oznacz gwiazdką sesje, na które chcesz pójść. Zapisują się w tej przeglądarce.</div>`;
  let h=`<h2>Moja agenda</h2><p class="lead">${picked.length} ${picked.length===1?'sesja':picked.length<5?'sesje':'sesji'} w Twoim planie, z obu agend.</p>`;
  [6,7,8].forEach(d=>{const l=picked.filter(x=>x.d===d).sort((a,b)=>mins(a.s)-mins(b.s));if(!l.length)return;
    // clash detection
    const clash=new Set();for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)if(mins(l[j].s)<mins(l[i].e))clash.add(l[i].id),clash.add(l[j].id);
    h+=`<div class="h5" style="margin-top:22px">0${d} · ${DAYN[d]}</div><ol class="tl">${l.map(x=>{let r=rowHTML(x,false);if(clash.has(x.id))r=r.replace('<div class="card">','<div class="card"><span class="tag r" style="float:right;margin-right:22px">Kolizja godzin</span>');return r}).join('')}</ol>`});
  return h;
}

function people(){
  const m=new Map();
  const add=(p,role,x,room)=>{if(!m.has(p.n))m.set(p.n,{n:p.n,c:p.c,roles:new Set(),s:[]});const o=m.get(p.n);if(p.c&&!o.c)o.c=p.c;o.roles.add(role);o.s.push({d:x.d,s:x.s,title:room||x.title,id:x.id})};
  S.forEach(x=>{
    (x.people||[]).forEach(p=>add(p,/Panel|Debata/.test(x.type)?'panel':'speaker',x));
    if(x.mod)add(x.mod,'mod',x);
    (x.rooms||[]).forEach(r=>r.people.forEach(p=>add(p,'room',x,'Breakout: '+r.title)));
  });
  return [...m.values()].sort((a,b)=>a.n.replace(/^(dr|prof\.) /,'').split(' ').pop().localeCompare(b.n.replace(/^(dr|prof\.) /,'').split(' ').pop(),'pl'));
}

const V={agenda:vAgenda,moja:vMoja,prelegenci:vPrelegenci,aktywnosci:vAkt,'o-evencie':vAbout};
const view=document.getElementById('view');
function render(keepFocus){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===st.view));
  view.innerHTML=V[st.view]();
  const mc=document.getElementById('mycount');mc.hidden=!fav.size;mc.textContent=fav.size;
  if(keepFocus){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function go(v,scrollTop=true){st.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();if(scrollTop)window.scrollTo({top:document.querySelector('.tabs').offsetTop,behavior:'smooth'})}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.v)});
view.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;render(true)}});
view.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.fav){fav.has(d.fav)?(fav.delete(d.fav),toast('Usunięto z mojej agendy')):(fav.add(d.fav),toast('Dodano do mojej agendy'));save();render();return}
  if(d.track){st.track=d.track;save();render();return}
  if(d.day){st.day=+d.day;render();return}
  if(d.role){st.role=d.role;render();return}
  if(d.toggle){st.open=st.open===d.toggle?null:d.toggle;render();return}
  if(d.act){st.open=ACTS[d.act].feats?d.act:null;go('aktywnosci',false);requestAnimationFrame(()=>document.getElementById('act-'+d.act)?.scrollIntoView({behavior:'smooth',block:'start'}));return}
  if(d.person){st.q=d.person;st.role='all';go('prelegenci');return}
  if(d.setTrack){st.track=d.setTrack;save()}
  if(d.go){if(d.go==='agenda'&&!d.setTrack)st.day=6;go(d.go);return}
  if(d.goto){const x=S.find(s=>s.id===d.goto);st.day=x.d;if(x.d!==8&&x.t.length===1)st.track=x.t;go('agenda',false);
    requestAnimationFrame(()=>{const el=view.querySelector(`[data-fav="${d.goto}"]`)?.closest('.row');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const c=el.querySelector('.card');c.style.outline='2px solid var(--red)';setTimeout(()=>c.style.outline='',1600)}})}
});

// countdown to 6 Nov 2026 10:00 Warsaw (CET, UTC+1)
const START=Date.UTC(2026,10,6,9,0),END=Date.UTC(2026,10,8,14,30);
function tick(){const n=Date.now(),el=document.getElementById('count');
  if(n>=END){el.innerHTML='<div><b>Dziękujemy</b><span>do zobaczenia</span></div>';return}
  if(n>=START){el.innerHTML='<div><b>Trwa</b><span>Business Weekend</span></div>';return}
  let s=Math.floor((START-n)/1000);const D=Math.floor(s/86400);s%=86400;const H=Math.floor(s/3600);s%=3600;const M=Math.floor(s/60);
  el.innerHTML=[[D,'dni'],[H,'godz.'],[M,'min']].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('')+'<div style="border-color:transparent;align-self:center"><span>do rejestracji<br>pt 6.11, 10:00</span></div>'}
tick();setInterval(tick,30000);

const h=(location.hash||'').slice(1);if(V[h])st.view=h;
render();
</script>
